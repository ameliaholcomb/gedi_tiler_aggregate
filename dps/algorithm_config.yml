algorithm_name: gedi-tiler-aggregate
algorithm_version: main
algorithm_description: >-
  Compute a share of the partitions of a gt_aggregate / gt_from_img dataset (GEDI-H3 style
  aggregation or raster sampling over the tiled GEDI database).
repository_url: https://github.com/ameliaholcomb/gedi_tiler_aggregate.git
docker_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v5.0.0
build_command: gedi_tiler_aggregate/dps/build.sh
run_command: gedi_tiler_aggregate/dps/run.sh
disk_space: 20GB
queue: maap-dps-worker-8gb
inputs:
  config: []
  file: []
  positional:
  - name: dataset
    description: Dataset directory on S3, planned by gt_aggregate or gt_from_img
    required: true
    default: ''
    test_value: s3://maap-ops-workspace/shared/ameliah/gtagg-test/dps_test
  - name: tag
    description: The submission's batch tag; its partitions are in <dataset>/_jobs/<tag>.json
    required: true
    default: ''
    test_value: test
  - name: job
    description: Index of this job in the submission
    required: true
    default: ''
    test_value: '0'
